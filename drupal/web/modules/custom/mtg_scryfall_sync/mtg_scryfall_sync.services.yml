services:
  mtg_scryfall_sync.set_taxonomy:
    class: Drupal\mtg_scryfall_sync\Service\SetTaxonomy
    arguments:
      - '@entity_type.manager'

  mtg_scryfall_sync.importer:
    class: Drupal\mtg_scryfall_sync\ScryfallImporter
    arguments:
      - '@entity_type.manager'
      - '@logger.factory'
      - '@state'
      - '@datetime.time'
      - '@http_client'
      - '@mtg_scryfall_sync.set_taxonomy'
      - '@database'
      - '@cache.entity'
      - '@cache_tags.invalidator'

  mtg_scryfall_sync.exchange_rate:
    class: Drupal\mtg_scryfall_sync\Service\ExchangeRate
    arguments:
      - '@http_client'
      - '@state'
      - '@datetime.time'
      - '@logger.factory'
