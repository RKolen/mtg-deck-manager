services:
  mtg_graphql.collection_ensurer:
    class: Drupal\mtg_graphql\Service\CollectionEnsurer
    arguments:
      - '@entity_type.manager'

  mtg_graphql.deck_card_mutator:
    class: Drupal\mtg_graphql\Service\DeckCardMutator
    arguments:
      - '@entity.repository'
      - '@mtg_graphql.collection_ensurer'

  mtg_graphql.meta_deck_scraper:
    class: Drupal\mtg_graphql\Service\MetaDeckScraperService
    arguments:
      - '@entity_type.manager'
      - '@http_client'
      - '@cache.graphql.results'

  mtg_graphql.wishlist:
    class: Drupal\mtg_graphql\Service\WishlistService
    arguments:
      - '@entity_type.manager'
      - '@entity.repository'
      - '@database'
      - '@mtg_graphql.deck_card_mutator'

  mtg_graphql.collection_importer:
    class: Drupal\mtg_graphql\Service\CollectionImporter
    arguments:
      - '@entity_type.manager'
      - '@database'
      - '@mtg_graphql.collection_ensurer'

  mtg_graphql.deck_build_pool:
    class: Drupal\mtg_graphql\Service\DeckBuildPool
    arguments:
      - '@entity_type.manager'
      - '@database'

  mtg_graphql.collection_reader:
    class: Drupal\mtg_graphql\Service\CollectionReader
    arguments:
      - '@database'
